name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check the committed build matches the source
        run: git diff --exit-code -- dist/

  hacs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
