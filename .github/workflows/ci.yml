name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check the committed build matches the source
        run: |
          changes=$(git status --porcelain -- dist/)
          if [ -n "$changes" ]; then
            echo "dist/ does not match the source, run npm run build:" >&2
            echo "$changes" >&2
            exit 1
          fi

  hacs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
